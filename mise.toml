# ============================================
# Global mise configuration
# Project-specific versions override these
# ============================================

[env]
# Enable YJIT for Ruby (faster)
RUBY_CONFIGURE_OPTS = "--enable-yjit"

# ============================================
# Runtimes - always install latest
# ============================================
[tools]
bun = "latest"
node = "latest"
pnpm = "latest"
aube = "latest" # node install tool
ruby = "latest"
python = "latest"
rust = "stable"

# ============================================
# Global npm packages
# ============================================
# The tool-update service below checks these global tools (mise >= 2026.10.9).
# Coding agents check every 6h; supporting CLIs check daily.
"npm:@antfu/ni" = { version = "latest", auto_update = "24h" } # Unified package manager (ni, nr, nx)
"npm:opencode-ai" = { version = "latest", auto_update = "6h" } # OpenCode CLI
"npm:vercel" = "latest"                          # Vercel CLI
"npm:btca" = { version = "latest", auto_update = "24h" } # BTCA CLI
"npm:@earendil-works/pi-coding-agent" = { version = "latest", auto_update = "6h" } # pi
"npm:@openai/codex" = { version = "latest", auto_update = "6h" } # OpenAI Codex CLI (npm tracks releases ahead of the brew cask)
"npm:@railway/cli" = "latest"                    # Railway.app CLI
"npm:@withgraphite/graphite-cli" = "stable"      # Graphite CLI (gt) — stacked PRs
"npm:agent-browser" = { version = "latest", auto_update = "24h" } # Chrome automation

# ============================================
# Python tools via uv/pipx
# ============================================
uv = "latest"
"pipx:claude-monitor" = { version = "latest", auto_update = "24h" }
"pipx:wakatime" = { version = "latest", auto_update = "24h" } # Coding time tracker
"pipx:yt-dlp" = { version = "latest", extras = "default", auto_update = "24h" } # Includes yt-dlp-ejs; mise installs it with uv

# ============================================
# CLI tools (prebuilt binaries)
# ============================================
"github:Zeko369/overmind" = "2.5.2"              # Procfile manager — patched fork (tmux socket-name-length + .overmind.sock cleanup); DarthSim/overmind#204 unmerged
kubeseal = "latest"                              # Sealed Secrets CLI (was an undeclared ad-hoc install on the stale bitnami-labs backend)

# Check opted-in tools in the background, without delaying command launches.
[bootstrap.services.mise-tool-update]
builtin = "tool-update"

# ============================================
# Settings
# ============================================
[settings]
experimental = true
task.run_auto_install = false

# Keep the release-age safety delay globally, but let fast-moving agent CLIs update immediately.
minimum_release_age_excludes = ["npm:opencode-ai", "npm:@openai/codex", "npm:@earendil-works/pi-coding-agent"]

# Auto-create venvs with uv
python.uv_venv_auto = true

# Read .ruby-version, .node-version files
idiomatic_version_file_enable_tools = ["ruby", "node", "python", "bun"]

# Use bun for npm packages (faster)
[settings.npm]
# package_manager = "aube"
package_manager = "bun"
