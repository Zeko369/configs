# Debian/Ubuntu CLI tools installed via mise (prebuilt binaries).
# These tools aren't available in Debian/Ubuntu's apt repositories at all
# (or only in stale versions). They download quickly instead of compiling.
#
# Companion to install-debian.sh (--cli-dev tier and up). Aim is to bring
# Debian closer to Arch's native package coverage.
#
# install-debian.sh links this file to ~/.config/mise/config.local.toml.
# To reinstall the shared runtimes and Debian tools after that setup:
#   mise trust ~/repos/configs
#   mise -C ~/repos/configs install

[tools]
# ============================================
# Editor (the shared plugins require Neovim 0.11.3 or newer)
# ============================================
"aqua:neovim/neovim" = "latest"                # Debian/Ubuntu apt packages can be too old

# ============================================
# Shell prompt + history (bare-tier UX, but apt has neither)
# ============================================
"aqua:starship/starship" = "latest"
"aqua:atuinsh/atuin" = "latest"

# ============================================
# Modern CLI replacements
# ============================================
"aqua:bootandy/dust" = "latest"                 # dust — better du
"aqua:dalance/procs" = "latest"                 # procs — better ps
"conda:tokei" = "latest"                        # code statistics (upstream doesn't publish current binaries)
"aqua:tealdeer-rs/tealdeer" = "latest"          # tldr
"aqua:chmln/sd" = "latest"                      # better sed
"github:ouch-org/ouch" = "latest"               # ouch — universal compress/decompress
"aqua:ducaale/xh" = "latest"                    # better curl (HTTPie-like)
"aqua:zellij-org/zellij" = "latest"             # terminal multiplexer
"aqua:01mf02/jaq" = "latest"                    # faster jq
"aqua:pemistahl/grex" = "latest"                # regex from examples
"aqua:jj-vcs/jj" = "latest"                     # jujutsu VCS

# ============================================
# Prebuilt tools formerly installed via Go
# ============================================
"aqua:jesseduffield/lazygit" = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:wagoodman/dive" = "latest"
"aqua:charmbracelet/glow" = "latest"
"aqua:sclevine/yj" = "latest"
"aqua:mr-karan/doggo" = "latest"
"github:Zeko369/overmind" = "2.5.2"             # patched fork; DarthSim/overmind#204 remains unmerged
"aqua:gitleaks/gitleaks" = "latest"
"github:cloudflare/cloudflared" = "latest"      # upstream Go module has replace directives
"aqua:bitnami/sealed-secrets" = "latest"        # kubeseal
"aqua:digitalocean/doctl" = "latest"

# ============================================
# AI coding agents
# ============================================
# OpenAI Codex CLI lives in mise.toml as "npm:@openai/codex" (cross-platform)
